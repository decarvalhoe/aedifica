# Aedifica demo — single-VM Fly.io deployment (FastAPI + Next.js + SQLite on a volume).
# - One process: the entrypoint script starts uvicorn locally and `npm start` foreground.
# - The Fly-attached volume `aedifica_data` persists SQLite at /data/aedifica.db.
# - The VM auto-stops after idle and auto-starts on incoming requests (free-tier friendly).
#
# `app` is filled in by `flyctl launch` ; primary region defaults to Paris (cdg) for
# latency from Switzerland.

app = "aedifica-demo"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  AEDIFICA_DATABASE_URL = "sqlite:////data/aedifica.db"
  AEDIFICA_API = "http://127.0.0.1:8090"
  AEDIFICA_CORS_ORIGINS = "*"
  PORT = "3000"
  NODE_ENV = "production"

[[mounts]]
  source = "aedifica_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
