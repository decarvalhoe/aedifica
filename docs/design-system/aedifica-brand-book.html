px) {\n  :root { --margin: 24px; }\n  .bk-chead { grid-template-columns: 1fr; gap: var(--s-3); }\n  .bk-chead__num { border-top: none; padding-top: 0; }\n  .bk-cover__bottom { grid-template-columns: 1fr 1fr; gap: var(--s-4); }\n  .bk-nav__row { gap: 0 2px; }\n  .bk-disclaimer__meta { margin-left: 0; text-align: left; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }\n}\n\n@media print {\n  .bk-topbar, .bk-nav { display: none; }\n  body { background: #fff; }\n  .bk-chapter { break-inside: avoid; }\n}\n<\u002Fstyle>\n<style>\n  /* ---- deck shell ---- */\n  html, body { margin: 0; height: 100%; background: #0e0f11; }\n  deck-stage:not(:defined) { visibility: hidden; }\n\n  /* ---- slide frame ---- */\n  .slide {\n    box-sizing: border-box; width: 100%; height: 100%;\n    background: var(--paper); color: var(--fg-1);\n    padding: 64px 84px 52px; display: flex; flex-direction: column;\n    font-family: var(--font-ui);\n  }\n  .slide--ink { background: var(--ink); color: var(--paper); }\n  .slide__head { border-bottom: 1px solid var(--ink); padding-bottom: 22px; margin-bottom: 34px; flex: none; }\n  .slide--ink .slide__head { border-bottom-color: rgba(243,241,236,0.4); }\n  .slide__kicker { display: flex; align-items: baseline; gap: 18px; margin-bottom: 16px; }\n  .snum { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; color: var(--accent); }\n  .slide .ds-eyebrow { font-size: 12px; }\n  .d-title { font-family: var(--font-display); font-weight: 300; font-size: 46px; line-height: 1.03; letter-spacing: -0.025em; margin: 0; max-width: 26ch; }\n  .d-lead { font-family: var(--font-ui); font-size: 19px; line-height: 1.5; color: var(--ink-90); margin: 16px 0 0; max-width: 88ch; }\n  .slide--ink .d-lead { color: rgba(243,241,236,0.82); }\n  .slide__body { flex: 1; min-height: 0; }\n  .slide__foot { flex: none; margin-top: auto; padding-top: 18px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--fg-3); }\n  .slide__foot b { color: var(--ink); font-weight: 500; }\n\n  /* ---- non-responsive grids (deck is scaled, never reflowed) ---- */\n  .g2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }\n  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }\n  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }\n  .g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }\n  .gap-tight { gap: 14px; }\n  .stack { display: flex; flex-direction: column; gap: 22px; }\n  .slide .dodont { grid-template-columns: 1fr 1fr; }\n  .slide .lex { grid-template-columns: 1fr 1fr; }\n  .fill { height: 100%; }\n  .vc { display: flex; flex-direction: column; justify-content: center; }\n\n  /* deck-native body sizing bumps for narrative panels */\n  .slide .panel .ds-body-sm { font-size: 14px; line-height: 1.5; }\n  .slide .bk-stmt p { font-size: 14px; line-height: 1.5; }\n  .slide .bk-stmt h4 { font-size: 18px; }\n\n  @media print { html, body { background: #fff; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ICON SPRITE -->\n<svg xmlns=\"http://www.w3.org/2000/svg\" style=\"display:none\" aria-hidden=\"true\">\n  <symbol id=\"ic-intake\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M4 14V19H20V14\"><\u002Fpath><path d=\"M12 4V13\"><\u002Fpath><path d=\"M8 9L12 13L16 9\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-evidence\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"16\"><\u002Frect><path d=\"M8 9H16\"><\u002Fpath><path d=\"M8 12H16\"><\u002Fpath><path d=\"M8 15H13\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-report\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\"><\u002Frect><path d=\"M5 7.5H19\"><\u002Fpath><path d=\"M8 11H16\"><\u002Fpath><path d=\"M8 14H16\"><\u002Fpath><path d=\"M8 17H13\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-export\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M4 14V19H20V14\"><\u002Fpath><path d=\"M12 13V4\"><\u002Fpath><path d=\"M8 8L12 4L16 8\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-source\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"4\" y=\"4\" width=\"7\" height=\"7\"><\u002Frect><path d=\"M11 11L17 17\"><\u002Fpath><circle cx=\"18.4\" cy=\"18.4\" r=\"1.6\"><\u002Fcircle><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-check\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M5 12L10 17L19 6\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-portfolio\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"4\" y=\"4\" width=\"6\" height=\"6\"><\u002Frect><rect x=\"14\" y=\"4\" width=\"6\" height=\"6\"><\u002Frect><rect x=\"4\" y=\"14\" width=\"6\" height=\"6\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"6\" height=\"6\"><\u002Frect><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-parcel\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M4 7L13 4L20 9L17 20L6 18Z\"><\u002Fpath><path d=\"M13 4L6 18\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-permit\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\"><\u002Frect><path d=\"M8.5 12L11 14.5L16 9\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-opposition\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><circle cx=\"11\" cy=\"13\" r=\"8\"><\u002Fcircle><circle cx=\"11\" cy=\"13\" r=\"4\"><\u002Fcircle><path d=\"M11 13L19 5\"><\u002Fpath><\u002Fg><rect x=\"17.2\" y=\"3.2\" width=\"3.2\" height=\"3.2\" fill=\"currentColor\"><\u002Frect><\u002Fsymbol>\n  <symbol id=\"ic-layers\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 4L20 8L12 12L4 8Z\"><\u002Fpath><path d=\"M4 12L12 16L20 12\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-search\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><circle cx=\"11\" cy=\"11\" r=\"6\"><\u002Fcircle><path d=\"M15.5 15.5L20 20\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-filter\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M4 5H20L14 12V19L10 17V12Z\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-chevron-right\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M9 5L16 12L9 19\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-chevron-down\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M5 9L12 16L19 9\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-plus\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 4V20\"><\u002Fpath><path d=\"M4 12H20\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-cross\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M6 6L18 18\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-clock\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><path d=\"M12 7V12L16 14\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-calendar\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\"><\u002Frect><path d=\"M4 9H20\"><\u002Fpath><path d=\"M9 3V7\"><\u002Fpath><path d=\"M15 3V7\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-datum-target\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><circle cx=\"12\" cy=\"12\" r=\"7\"><\u002Fcircle><path d=\"M12 1.5V22.5\"><\u002Fpath><path d=\"M1.5 12H22.5\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-datum-dimension\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M4 6V18\"><\u002Fpath><path d=\"M20 6V18\"><\u002Fpath><path d=\"M4 12H20\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-datum-north\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 3L17 21L12 16L7 21Z\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-ledger\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><rect x=\"4\" y=\"6\" width=\"3\" height=\"3\"><\u002Frect><rect x=\"4\" y=\"11\" width=\"3\" height=\"3\"><\u002Frect><rect x=\"4\" y=\"16\" width=\"3\" height=\"3\"><\u002Frect><path d=\"M10 7.5H20\"><\u002Fpath><path d=\"M10 12.5H20\"><\u002Fpath><path d=\"M10 17.5H20\"><\u002Fpath><\u002Fg><\u002Fsymbol>\n  <symbol id=\"ic-alert\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 4L21 20H3Z\"><\u002Fpath><path d=\"M12 10V14.5\"><\u002Fpath><\u002Fg><circle cx=\"12\" cy=\"17.4\" r=\"0.9\" fill=\"currentColor\"><\u002Fcircle><\u002Fsymbol>\n<\u002Fsvg>\n\n<deck-stage width=\"1600\" height=\"900\">\n\n  <!-- ============================= 01 · COVER ============================= -->\n  <section data-label=\"Couverture\">\n    <div class=\"slide\" style=\"padding:56px 84px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:18px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-2)\">\n        <span>Brand book<\u002Fspan><span>Direction 02A — Datum<\u002Fspan><span>Marque produit indépendante<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"slide__body vc\" style=\"justify-content:center\">\n        <p style=\"font-family:var(--font-mono);font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin:0 0 26px\">Préparation sourcée · pas une autorité<\u002Fp>\n        <div class=\"ds-wordmark\" style=\"font-size:158px;letter-spacing:0.02em;line-height:0.9\"><span class=\"ae\">Æ<\u002Fspan>DIFICA<\u002Fdiv>\n        <div style=\"height:18px;margin:14px 0 30px\">\n          <svg viewBox=\"0 0 1432 18\" preserveAspectRatio=\"none\" width=\"100%\" height=\"18\" style=\"overflow:visible\" aria-hidden=\"true\">\n            <path d=\"M0 12 H900 V5 H1432\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath>\n            <circle cx=\"900\" cy=\"12\" r=\"4\" fill=\"#C0392B\"><\u002Fcircle>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <p style=\"font-family:var(--font-display);font-weight:300;font-size:34px;letter-spacing:-0.02em;line-height:1.08;margin:0;max-width:24ch\">Le livre de marque du système qui prépare l'évidence, sans jamais trancher.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-top:22px;border-top:1px solid var(--ink)\">\n        <div><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px\">Édition<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ink)\">v4 · 2026-05-31<\u002Fspan><\u002Fdiv>\n        <div><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px\">Direction<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ink)\">02A — Datum · validée<\u002Fspan><\u002Fdiv>\n        <div><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px\">Type lock<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ink)\">Space Grotesk · IBM Plex Mono<\u002Fspan><\u002Fdiv>\n        <div><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px\">Référence<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ink)\">DATUM +13.50<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 02 · POSTURE ============================= -->\n  <section data-label=\"Posture\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 01<\u002Fspan><span class=\"ds-eyebrow\">Fondation · posture<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Nous préparons l'évidence. Nous ne sommes pas une autorité.<\u002Fh2>\n        <p class=\"d-lead\">AEDIFICA est une marque produit suisse, indépendante, pour les bureaux d'architecture. Elle réunit l'intelligence projet qui précède un dossier de permis et la présente avec sa provenance explicite. Elle prépare ; elle ne décide pas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g2 fill\" style=\"align-items:start\">\n          <div class=\"panel panel--pad datum-frame fill\"><p class=\"ds-eyebrow\" style=\"margin-bottom:12px;color:var(--accent)\">Ce que nous sommes<\u002Fp><p class=\"ds-body\" style=\"font-size:16px\">Une préparation <b>sourcée<\u002Fb> : chaque information citée porte sa référence, sa confiance et son état. Un bureau sous délai gagne une mémoire fiable et un dossier prêt à l'examen de l'autorité compétente.<\u002Fp><\u002Fdiv>\n          <div class=\"panel panel--pad fill\"><p class=\"ds-eyebrow\" style=\"margin-bottom:12px\">Ce que nous ne sommes pas<\u002Fp><p class=\"ds-body\" style=\"font-size:16px\">Ni une autorité légale, ni un assistant conversationnel générique. Nous n'énonçons jamais la conformité, l'approbation ou l'issue juridique comme un fait. La décision et le dépôt restent à l'architecte.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 01 · Posture<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 03 · CLAIM ============================= -->\n  <section data-label=\"Revendication\">\n    <div class=\"slide slide--ink\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 01.1<\u002Fspan><span class=\"ds-eyebrow\" style=\"color:var(--n-300)\">La revendication obligatoire &amp; le réflexe de provenance<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__body vc\" style=\"justify-content:center;gap:48px\">\n        <div>\n          <p style=\"font-family:var(--font-display);font-weight:300;font-size:64px;line-height:1.04;letter-spacing:-0.02em;margin:0;max-width:20ch;color:var(--paper)\">Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fp>\n          <p class=\"d-lead\" style=\"margin-top:24px;color:rgba(243,241,236,0.82)\">Cette phrase figure sur chaque surface et chaque rapport. Ce n'est pas une mention décorative : c'est le contrat de lecture de la marque. L'architecte reste responsable de la décision et du dépôt.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p class=\"ds-eyebrow\" style=\"color:var(--n-300);margin-bottom:14px\">Aucune affirmation sans l'un des six états<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <span class=\"ds-ts is-sourced\" style=\"background:transparent\"><span class=\"dot\"><\u002Fspan>Sourced<\u002Fspan>\n            <span class=\"ds-ts is-computed\" style=\"background:transparent\"><span class=\"dot\"><\u002Fspan>Computed<\u002Fspan>\n            <span class=\"ds-ts is-assume\" style=\"background:transparent\"><span class=\"dot\"><\u002Fspan>Assumption<\u002Fspan>\n            <span class=\"ds-ts is-unknown\" style=\"background:transparent\"><span class=\"dot\"><\u002Fspan>Unknown<\u002Fspan>\n            <span class=\"ds-ts is-conflict\" style=\"background:transparent\"><span class=\"dot\"><\u002Fspan>Conflict<\u002Fspan>\n            <span class=\"ds-ts is-decision\"><span class=\"dot\"><\u002Fspan>Decision<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\" style=\"border-top-color:rgba(243,241,236,0.3);color:var(--n-300)\"><span>Le réflexe de provenance<\u002Fspan><span>§ 01 · Posture<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 04 · PLATEFORME ============================= -->\n  <section data-label=\"Plateforme\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 02<\u002Fspan><span class=\"ds-eyebrow\">Plateforme de marque<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Mission, promesse, public.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g3 fill\" style=\"align-items:start\">\n          <div class=\"panel panel--pad fill\"><p class=\"ds-eyebrow\" style=\"margin-bottom:12px\">Mission<\u002Fp><p class=\"ds-body\" style=\"font-size:16px\">Transformer l'information dispersée d'un projet en une mémoire sourcée et vérifiable, prête pour l'examen de l'autorité.<\u002Fp><\u002Fdiv>\n          <div class=\"panel panel--pad fill\"><p class=\"ds-eyebrow\" style=\"margin-bottom:12px\">Promesse<\u002Fp><p class=\"ds-body\" style=\"font-size:16px\">À chaque affirmation, vous voyez d'où elle vient et quel est son degré de certitude. Rien n'est masqué, surtout pas l'inconnu.<\u002Fp><\u002Fdiv>\n          <div class=\"panel panel--pad fill\"><p class=\"ds-eyebrow\" style=\"margin-bottom:12px\">Public<\u002Fp><p class=\"ds-body\" style=\"font-size:16px\">Les bureaux d'architecture suisses-romands sous délai, qui respectent la rigueur du métier et veulent une préparation exacte.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 02 · Plateforme<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 05 · PRINCIPES ============================= -->\n  <section data-label=\"6 principes\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 02.1<\u002Fspan><span class=\"ds-eyebrow\">Les six principes<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Six engagements décident de tout le reste.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g3 gap-tight fill\" style=\"align-items:stretch\">\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">01<\u002Fspan><h4>L'évidence avant l'affirmation<\u002Fh4><p>Rien n'est énoncé sans provenance. Chaque affirmation porte un état ; nous ne cachons jamais ce que nous ignorons.<\u002Fp><\u002Fdiv>\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">02<\u002Fspan><h4>Non-autorité<\u002Fh4><p>Nous préparons, nous ne tranchons pas. Langage, mise en page et rapports évitent toute posture d'autorité ou d'issue garantie.<\u002Fp><\u002Fdiv>\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">03<\u002Fspan><h4>Le datum comme structure<\u002Fh4><p>Lignes de référence, grilles et cotes sont la logique visuelle — pas un décor. La page est un dessin, mesuré et aligné.<\u002Fp><\u002Fdiv>\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">04<\u002Fspan><h4>Les états sont de premier rang<\u002Fh4><p>Les six états de confiance sont des objets conçus, avec couleur et libellé.<\u002Fp><\u002Fdiv>\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">05<\u002Fspan><h4>Densité maîtrisée<\u002Fh4><p>Dense là où vivent les données, généreux là où se prennent les décisions. L'air est un outil, pas un défaut.<\u002Fp><\u002Fdiv>\n          <div class=\"bk-stmt fill\"><span class=\"bk-stmt__n\">06<\u002Fspan><h4>Radical, mais utile<\u002Fh4><p>La précision suisse post-classique au service d'un bureau sous délai. Aucun dégradé magique, aucune bulle, aucun verre.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 02 · Plateforme<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 06 · VOIX ============================= -->\n  <section data-label=\"Voix &amp; lexique\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 03<\u002Fspan><span class=\"ds-eyebrow\">Voix &amp; ton · lexique<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Écrire comme un bureau technique précis.<\u002Fh2>\n        <p class=\"d-lead\">Calme, factuel, exact. Le contenu est une évidence, pas une persuasion. Sûr de la méthode, jamais de l'issue. Vouvoiement : le lecteur est un professionnel.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g2\" style=\"align-items:start;gap:28px\">\n          <div class=\"g2 gap-tight\" style=\"align-content:start\">\n            <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Précis<\u002Fp><p class=\"ds-body-sm\">Une donnée, une source, une confiance.<\u002Fp><\u002Fdiv>\n            <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Factuel<\u002Fp><p class=\"ds-body-sm\">Sourcé, calculé, présumé ou inconnu.<\u002Fp><\u002Fdiv>\n            <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Sobre<\u002Fp><p class=\"ds-body-sm\">Pas de superlatif ni de promesse d'issue.<\u002Fp><\u002Fdiv>\n            <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Architectural<\u002Fp><p class=\"ds-body-sm\">Conventions romandes, vocabulaire du métier.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"lex\">\n            <div class=\"lex__col lex--use\">\n              <div class=\"lex__head\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg>À utiliser<\u002Fdiv>\n              <ul class=\"lex__list\"><li>sourcé · évidence · provenance<\u002Fli><li>préparation · dossier · parcelle<\u002Fli><li>hypothèse · inconnue · à confirmer<\u002Fli><li>contrainte · recul · indice · faîte<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n            <div class=\"lex__col lex--avoid\">\n              <div class=\"lex__head\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-cross\"><\u002Fuse><\u002Fsvg>À éviter<\u002Fdiv>\n              <ul class=\"lex__list\"><li>garanti · approuvé · conforme<\u002Fli><li>autorité · décision finale<\u002Fli><li>magique · intelligent · révolutionnaire<\u002Fli><li>game changer · disruptif<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 03 · Voix<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 07 · CTA + CONVENTIONS ============================= -->\n  <section data-label=\"CTA &amp; conventions\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 03.2<\u002Fspan><span class=\"ds-eyebrow\">CTA &amp; typographie éditoriale<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Appels à l'action calmes, formats suisses exacts.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g2\" style=\"align-items:start;gap:28px\">\n          <div class=\"lex\">\n            <div class=\"lex__col lex--use\">\n              <div class=\"lex__head\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg>Appels à l'action<\u002Fdiv>\n              <ul class=\"lex__list\"><li>Ouvrir le projet · Voir le détail<\u002Fli><li>Voir la source · Exporter A4<\u002Fli><li>Marquer comme hypothèse<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n            <div class=\"lex__col lex--avoid\">\n              <div class=\"lex__head\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-cross\"><\u002Fuse><\u002Fsvg>Jamais<\u002Fdiv>\n              <ul class=\"lex__list\"><li>Booster · Foncer<\u002Fli><li>Découvrir la magie<\u002Fli><li>Révolutionnez votre bureau<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel panel--pad\">\n            <p class=\"ds-eyebrow\" style=\"margin-bottom:14px\">Conventions suisses<\u002Fp>\n            <table class=\"spec\">\n              <tbody><tr><td class=\"tok\">CHF 1'200.00<\u002Ftd><td class=\"use\">apostrophe suisse · séparateur de milliers<\u002Ftd><\u002Ftr>\n              <tr><td class=\"tok\">18.05.2026<\u002Ftd><td class=\"use\">date · points<\u002Ftd><\u002Ftr>\n              <tr><td class=\"tok\">12 m · 0.6 · 15 %<\u002Ftd><td class=\"use\">espace insécable avant l'unité<\u002Ftd><\u002Ftr>\n              <tr><td class=\"tok\">AED-2026-0042<\u002Ftd><td class=\"use\">IDs &amp; références toujours en mono<\u002Ftd><\u002Ftr>\n            <\u002Ftbody><\u002Ftable>\n            <p class=\"ds-caption\" style=\"margin-top:14px\">Casse phrase pour le contenu. CAPITALES réservées aux eyebrows et libellés mono. Aucun emoji ; seul le point médian <span class=\"bk-k\">·<\u002Fspan> comme séparateur.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 03 · Voix<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 08 · LOGO — LOCKUPS ============================= -->\n  <section data-label=\"Logo · lockups\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 04<\u002Fspan><span class=\"ds-eyebrow\">Le signe · lockups<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">ÆDIFICA — un mot-signe typographique et exact.<\u002Fh2>\n        <p class=\"d-lead\">ÆDIFICA en Space Grotesk Light, la ligature Æ d'un cran plus appuyée (400 vs 300), sur un datum rouge rompu une fois par une fracture d'un module.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g4 fill\" style=\"align-items:stretch\">\n          <div style=\"display:flex;flex-direction:column\"><div class=\"app-frame fill\"><svg viewBox=\"0 0 480 130\" width=\"100%\" role=\"img\" aria-label=\"ÆDIFICA horizontal\"><text x=\"452\" y=\"34\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"11\" letter-spacing=\"1.6\" fill=\"#87867D\">DATUM +13.50<\u002Ftext><text x=\"26\" y=\"92\" font-size=\"68\" font-weight=\"300\" letter-spacing=\"2\" fill=\"#16171A\" font-family=\"Space Grotesk\"><tspan font-weight=\"400\">Æ<\u002Ftspan>DIFICA<\u002Ftext><path d=\"M26 112 H300 V106 H454\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">horizontal — primaire<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\"><div class=\"app-frame fill\" style=\"background:var(--ink)\"><svg viewBox=\"0 0 480 130\" width=\"100%\" role=\"img\" aria-label=\"ÆDIFICA inverse\"><text x=\"452\" y=\"34\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"11\" letter-spacing=\"1.6\" fill=\"#908E85\">DATUM +13.50<\u002Ftext><text x=\"26\" y=\"92\" font-size=\"68\" font-weight=\"300\" letter-spacing=\"2\" fill=\"#F3F1EC\" font-family=\"Space Grotesk\"><tspan font-weight=\"400\">Æ<\u002Ftspan>DIFICA<\u002Ftext><path d=\"M26 112 H300 V106 H454\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">reverse — sur ink<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\"><div class=\"app-frame fill\"><svg viewBox=\"0 0 320 200\" width=\"150\" role=\"img\" aria-label=\"ÆDIFICA empilé\"><text x=\"160\" y=\"78\" font-size=\"64\" font-weight=\"400\" text-anchor=\"middle\" fill=\"#16171A\" font-family=\"Space Grotesk\">Æ<\u002Ftext><text x=\"160\" y=\"138\" font-size=\"38\" font-weight=\"300\" letter-spacing=\"2\" text-anchor=\"middle\" fill=\"#16171A\" font-family=\"Space Grotesk\"><tspan font-weight=\"400\">Æ<\u002Ftspan>DIFICA<\u002Ftext><path d=\"M70 152 H180 V147 H250\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">stacked — compact<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\"><div class=\"app-frame fill\"><svg viewBox=\"0 0 160 160\" width=\"110\" role=\"img\" aria-label=\"ÆDIFICA monogramme\"><line x1=\"28\" y1=\"44\" x2=\"132\" y2=\"44\" stroke=\"#16171A\" stroke-opacity=\"0.18\" stroke-width=\"1\"><\u002Fline><text x=\"80\" y=\"108\" font-size=\"98\" font-weight=\"400\" text-anchor=\"middle\" fill=\"#16171A\" font-family=\"Space Grotesk\">Æ<\u002Ftext><path d=\"M28 128 H92 V122 H132\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath><text x=\"132\" y=\"146\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"9\" letter-spacing=\"1.5\" fill=\"#87867D\">+13.50<\u002Ftext><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">monogram + favicon<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 04 · Logo<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 09 · LOGO — CONSTRUCTION ============================= -->\n  <section data-label=\"Logo · construction\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 04.2<\u002Fspan><span class=\"ds-eyebrow\">Construction · zone de protection · tailles minimales<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g2\" style=\"align-items:start;gap:24px;margin-bottom:20px\">\n          <div><div class=\"app-frame\" style=\"min-height:230px;justify-content:flex-start\"><svg viewBox=\"0 0 480 130\" width=\"100%\" role=\"img\" aria-label=\"construction\"><g stroke=\"#16171A\" stroke-opacity=\"0.14\" stroke-width=\"1\"><line x1=\"0\" y1=\"32\" x2=\"480\" y2=\"32\"><\u002Fline><line x1=\"0\" y1=\"58\" x2=\"480\" y2=\"58\"><\u002Fline><line x1=\"0\" y1=\"84\" x2=\"480\" y2=\"84\"><\u002Fline><\u002Fg><text x=\"26\" y=\"92\" font-size=\"68\" font-weight=\"300\" letter-spacing=\"2\" fill=\"#16171A\" font-family=\"Space Grotesk\"><tspan font-weight=\"400\">Æ<\u002Ftspan>DIFICA<\u002Ftext><path d=\"M26 112 H300 V106 H454\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"><\u002Fpath><circle cx=\"300\" cy=\"112\" r=\"3\" fill=\"#C0392B\"><\u002Fcircle><text x=\"312\" y=\"103\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#C0392B\">fracture<\u002Ftext><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">Le wordmark repose sur le datum. La fracture = retrait d'1 module (6 px) à droite.<\u002Fp><\u002Fdiv>\n          <div><div class=\"app-frame\" style=\"min-height:230px\"><svg viewBox=\"0 0 200 150\" width=\"190\" role=\"img\" aria-label=\"zone de protection\"><rect x=\"20\" y=\"35\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"#16171A\" stroke-opacity=\"0.2\" stroke-dasharray=\"4 4\"><\u002Frect><text x=\"100\" y=\"92\" font-size=\"34\" font-weight=\"400\" text-anchor=\"middle\" fill=\"#16171A\" font-family=\"Space Grotesk\">Æ<\u002Ftext><line x1=\"20\" y1=\"125\" x2=\"40\" y2=\"125\" stroke=\"#C0392B\" stroke-width=\"1.5\"><\u002Fline><text x=\"44\" y=\"129\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#C0392B\">X<\u002Ftext><\u002Fsvg><\u002Fdiv><p class=\"app-cap\">Zone de protection = X (hauteur du Æ) sur chaque côté.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"g3 gap-tight\">\n          <div class=\"app-frame\" style=\"flex-direction:column;gap:12px;min-height:96px\"><span class=\"ds-wordmark\" style=\"font-size:22px\"><span class=\"ae\">Æ<\u002Fspan>DIFICA<\u002Fspan><span class=\"mono\" style=\"color:var(--mut);font-size:11px\">écran — min 120 px / 24 px h<\u002Fspan><\u002Fdiv>\n          <div class=\"app-frame\" style=\"flex-direction:column;gap:12px;min-height:96px\"><span class=\"ds-wordmark\" style=\"font-size:15px\"><span class=\"ae\">Æ<\u002Fspan>DIFICA<\u002Fspan><span class=\"mono\" style=\"color:var(--mut);font-size:11px\">print — min 14 mm<\u002Fspan><\u002Fdiv>\n          <div class=\"app-frame\" style=\"flex-direction:column;gap:12px;min-height:96px\"><span class=\"ds-wordmark\" style=\"font-weight:400;font-size:26px\">Æ<\u002Fspan><span class=\"mono\" style=\"color:var(--mut);font-size:11px\">monogramme — min 16 px<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 04 · Logo<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 10 · LOGO — DO/DON'T ============================= -->\n  <section data-label=\"Logo · do / don't\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 04.4<\u002Fspan><span class=\"ds-eyebrow\">Do / Don't · vectorisation<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"dodont\" style=\"margin-bottom:22px\">\n          <div class=\"dd dd--do\"><div class=\"dd__tag\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg>Do<\u002Fdiv><div class=\"dd__body\"><ul><li>Æ légèrement plus appuyé que le reste (400 vs 300).<\u002Fli><li>Ink / surface / reverse, avec datum rouge.<\u002Fli><li>Respecter la zone de protection X et les tailles minimales.<\u002Fli><li>Vectoriser le wordmark pour la production.<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd dd--dont\"><div class=\"dd__tag\"><svg class=\"i\" style=\"width:15px;height:15px\"><use href=\"#ic-cross\"><\u002Fuse><\u002Fsvg>Don't<\u002Fdiv><div class=\"dd__body\"><ul><li>Ne pas grossir / graisser le wordmark — il reste Light.<\u002Fli><li>Ne jamais changer la police (Space Grotesk uniquement).<\u002Fli><li>Ne pas recolorer hors palette (ink / surface / accent).<\u002Fli><li>Ne pas sur-espacer, étirer, ni poser sur aplat accent.<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note note--info\"><span class=\"note__label\">Vectorisation<\u002Fspan>Le wordmark dépend de Space Grotesk Light. Dans tout artwork exporté (PDF, EPS, SVG, social), convertir le texte en tracés pour qu'il ne retombe jamais sur une police système — la cause d'un rendu « faux ». Conserver un master éditable. <b>Baseline / tagline : non validée — à définir.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 04 · Logo<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 11 · COULEUR — CORE/NEUTRES ============================= -->\n  <section data-label=\"Couleur · core\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 05<\u002Fspan><span class=\"ds-eyebrow\">Couleur &amp; états<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">La provenance EST le système chromatique.<\u002Fh2>\n        <p class=\"d-lead\">Deux encres sur papier de calque chaud, plus un rouge datum unique pour la référence active — employé avec parcimonie, jamais comme décor ni comme état.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g4\" style=\"margin-bottom:26px\">\n          <div class=\"swatch\"><div class=\"swatch__chip\" style=\"background:var(--surface)\"><\u002Fdiv><div class=\"swatch__meta\"><div class=\"swatch__name\">--surface<\u002Fdiv><div class=\"swatch__hex\">#F3F1EC<\u002Fdiv><div class=\"swatch__use\">Papier. Le fond, toujours. Jamais de blanc pur.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\"><div class=\"swatch__chip\" style=\"background:var(--ink)\"><\u002Fdiv><div class=\"swatch__meta\"><div class=\"swatch__name\">--ink<\u002Fdiv><div class=\"swatch__hex\">#16171A<\u002Fdiv><div class=\"swatch__use\">Encre. Texte, structure, datum fort.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\"><div class=\"swatch__chip\" style=\"background:var(--accent)\"><\u002Fdiv><div class=\"swatch__meta\"><div class=\"swatch__name\">--accent<\u002Fdiv><div class=\"swatch__hex\">#C0392B<\u002Fdiv><div class=\"swatch__use\">Rouge datum. Référence active, action clé. Rare.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\"><div class=\"swatch__chip\" style=\"background:var(--accent-2)\"><\u002Fdiv><div class=\"swatch__meta\"><div class=\"swatch__name\">--accent-2<\u002Fdiv><div class=\"swatch__hex\">#908E85<\u002Fdiv><div class=\"swatch__use\">Béton. Secondaire / inactif.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ds-eyebrow\" style=\"margin-bottom:12px\">Neutres — alphas d'encre &amp; gris muté<\u002Fp>\n        <div class=\"ramp\">\n          <div style=\"background:var(--n-0)\"><span style=\"color:var(--ink)\">n-0<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-50)\"><span style=\"color:var(--ink)\">n-50<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-100)\"><span style=\"color:var(--ink)\">n-100<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-200)\"><span style=\"color:var(--ink)\">n-200<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-300)\"><span style=\"color:var(--ink)\">n-300<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-400)\"><span style=\"color:#fff\">n-400<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-500)\"><span style=\"color:#fff\">n-500<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-700)\"><span style=\"color:#fff\">n-700<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--n-900)\"><span style=\"color:#fff\">n-900<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 05 · Couleur<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 12 · COULEUR — 6 ÉTATS ============================= -->\n  <section data-label=\"6 trust states\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 05.3<\u002Fspan><span class=\"ds-eyebrow\">Les six états de confiance<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Fixes, sémantiques, jamais décoratifs.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g3 gap-tight\" style=\"margin-bottom:18px\">\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-sourced)\"><span class=\"state-card__sq solid\"><\u002Fspan><div><div class=\"state-card__name\">Sourced<\u002Fdiv><div class=\"state-card__hex\">#1F7A44<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Adossé à une source citable.<\u002Fp><span class=\"ex\">RPGA art. 19 al. 2 · conf 0.92<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-computed)\"><span class=\"state-card__sq solid\"><\u002Fspan><div><div class=\"state-card__name\">Computed<\u002Fdiv><div class=\"state-card__hex\">#475569<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Dérivé par calcul d'entrées sourcées.<\u002Fp><span class=\"ex\">IBUS 0.6 · dérivé<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-assume)\"><span class=\"state-card__sq solid\"><\u002Fspan><div><div class=\"state-card__name\">Assumption<\u002Fdiv><div class=\"state-card__hex\">#9A6A10<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Hypothèse à confirmer. Déclarée.<\u002Fp><span class=\"ex\">recul est présumé 6 m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-unknown)\"><span class=\"state-card__sq dashed\"><\u002Fspan><div><div class=\"state-card__name\">Unknown<\u002Fdiv><div class=\"state-card__hex\">#84847A<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Vérification humaine requise (dashed).<\u002Fp><span class=\"ex\">hauteur au faîte — à sourcer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-conflict)\"><span class=\"state-card__sq solid\"><\u002Fspan><div><div class=\"state-card__name\">Conflict<\u002Fdiv><div class=\"state-card__hex\">#C1122C<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Sources en désaccord. Arbitrage.<\u002Fp><span class=\"ex\">RDPPF ≠ règlement<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"state-card\"><div class=\"state-card__top\" style=\"color:var(--ts-decision)\"><span class=\"state-card__sq solid\"><\u002Fspan><div><div class=\"state-card__name\">Decision<\u002Fdiv><div class=\"state-card__hex\">#16171A<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"state-card__body\"><p class=\"ds-body-sm\">Choix arbitré et figé. Ink, plein.<\u002Fp><span class=\"ex\">implantation B · #0042<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note note--info\"><span class=\"note__label\">Règle<\u002Fspan>Le rouge datum est réservé à la référence active et à l'action primaire — <b>jamais comme état<\u002Fb>. Sourced est vert, Conflict est rouge. La couleur ne porte jamais le sens seule : toujours avec le libellé.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 05 · Couleur<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 13 · TYPE — LOCK + SPÉCIMENS ============================= -->\n  <section data-label=\"Typographie\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 06<\u002Fspan><span class=\"ds-eyebrow\">Typographie<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Deux familles. Une règle chacune.<\u002Fh2>\n        <p class=\"d-lead\">Space Grotesk porte tout ce qui est visible. IBM Plex Mono n'apparaît que pour les annotations d'évidence. <b>IBM Plex Sans est interdit<\u002Fb>, comme Inter / Roboto / Arial.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"slide__body\">\n        <div class=\"g3\" style=\"margin-bottom:8px\">\n          <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Display &amp; wordmark<\u002Fp><div style=\"font-family:var(--font-display);font-weight:300;font-size:44px;line-height:1;letter-spacing:-.02em\">Aa<\u002Fdiv><p class=\"ds-caption\" style=\"margin-top:10px\">Space Grotesk <b>Light 300<\u002Fb><\u002Fp><\u002Fdiv>\n          <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">UI &amp; corps<\u002Fp><div style=\"font-family:var(--font-ui);font-weight:400;font-size:44px;line-height:1\">Aa<\u002Fdiv><p class=\"ds-caption\" style=\"margin-top:10px\">Space Grotesk <b>400 / 500<\u002Fb><\u002Fp><\u002Fdiv>\n          <div class=\"panel\"><p class=\"ds-eyebrow\" style=\"margin-bottom:8px\">Évidence uniquement<\u002Fp><div style=\"font-family:var(--font-mono);font-weight:400;font-size:44px;line-height:1\">Aa<\u002Fdiv><p class=\"ds-caption\" style=\"margin-top:10px\">IBM Plex Mono <b>400 / 500<\u002Fb><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--ink)\">\n          <div class=\"spec-row\" style=\"padding:14px 0;border-top:none\"><div class=\"spec-row__meta\">display<br>Grotesk 300<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:42px;letter-spacing:-.025em;line-height:1\">Parcelle 4412<\u002Fdiv><\u002Fdiv>\n          <div class=\"spec-row\" style=\"padding:14px 0\"><div class=\"spec-row__meta\">title<br>Grotesk 400<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:400;font-size:26px\">Signaux de risque d'opposition<\u002Fdiv><\u002Fdiv>\n          <div class=\"spec-row\" style=\"padding:14px 0\"><div class=\"spec-row__meta\">body<br>Grotesk 400<\u002Fdiv><p class=\"ds-body\" style=\"font-size:16px;max-width:none\">La parcelle est en zone 2, hauteur limitée à 12 m. Deux des trois reculs sont confirmés ; le troisième est calculé et attend confirmation.<\u002Fp><\u002Fdiv>\n          <div class=\"spec-row\" style=\"padding:14px 0\"><div class=\"spec-row__meta\">evidence<br>Mono 400<\u002Fdiv><p class=\"evidence\">SRC · RDPPF-2024-0917 · art. 19 al. 2 · consulté 2026-05-12 · conf. 0.92<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide__foot\"><span><b>Préparation sourcée par AEDIFICA. Pas une autorité.<\u002Fb><\u002Fspan><span>§ 06 · Typographie<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= 14 · ICÔNES ============================= -->\n  <section data-label=\"Iconographie\">\n    <div class=\"slide\">\n      <div class=\"slide__head\">\n        <div class=\"slide__kicker\"><span class=\"snum\">§ 07<\u002Fspan><span class=\"ds-eyebrow\">Iconographie<\u002Fspan><\u002Fdiv>\n        <h2 class=\"d-title\">Un seul sprite propriétaire.<\u002Fh2>\n        <p class=\"d-lead\">Grille 24 px, trait 1.5 px, caps carrés. <b>Aucune bibliothèque externe<\u002Fb>, jamais
