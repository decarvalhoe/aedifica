document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>AEDIFICA — Brand book · Datum<\u002Ftitle>\n<link rel=\"icon\" href=\"14d660a6-cf69-41ef-8ee2-a62b3944c813\" type=\"image/svg+xml\">\n<style>/* ============================================================================\n   AEDIFICA — DATUM  ·  colors_and_type.css   (v4 · 2026-05-31)\n   Strictly based on the VALIDATED direction 02A \"Datum\" (source of truth:\n   project 0b56b66b). Canonical tokens carry their validated names + values;\n   a compatibility layer maps the documentation pages' aliases onto them.\n   ----------------------------------------------------------------------------\n   Type lock:  Space Grotesk (display Light 300 / UI 400–600) · IBM Plex Mono\n               (annotations only). IBM Plex Sans is forbidden.\n   Accent:     datum red #C0392B — the active reference line, used sparingly.\n   ========================================================================== */\n\n/* ---- Fonts (self-hosted) ------------------------------------------------- */\n@font-face {\n  font-family: \"Space Grotesk\";\n  src: url(\"8dc88881-7131-4393-8d35-d0b886450ea0\") format(\"truetype-variations\"),\n       url(\"8dc88881-7131-4393-8d35-d0b886450ea0\") format(\"truetype\");\n  font-weight: 300 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  src: url(\"7121c53d-18c7-41a0-ae5d-db4fcc2176bb\") format(\"truetype\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  src: url(\"77483877-08d8-419d-b522-50bd1ad7bfce\") format(\"truetype\");\n  font-weight: 500; font-style: normal; font-display: swap;\n}\n\n:root {\n  /* ===================== VALIDATED CANONICAL TOKENS ===================== */\n\n  /* type families */\n  --font-display: \"Space Grotesk\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui:      \"Space Grotesk\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", monospace;\n\n  /* color · core (Datum) */\n  --surface:   #F3F1EC;   /* paper / app background */\n  --surface-2: #FFFFFF;   /* report sheet / raised paper */\n  --ink:       #16171A;   /* primary text, structure */\n  --accent:    #C0392B;   /* datum red — the active reference line. Sparingly. */\n  --accent-2:  #908E85;   /* concrete grey — secondary / inactive */\n\n  /* color · neutral scale */\n  --ink-90: rgba(22,23,26,0.90);\n  --ink-70: rgba(22,23,26,0.70);\n  --ink-50: rgba(22,23,26,0.50);\n  --mut:    #87867D;\n  --line:   rgba(22,23,26,0.12);\n  --line-2: rgba(22,23,26,0.24);\n\n  /* color · trust states (the six — semantic, fixed) */\n  --ts-sourced:  #1F7A44;   /* adossé à une source citable */\n  --ts-computed: #475569;   /* dérivé par calcul */\n  --ts-assume:   #9A6A10;   /* hypothèse à confirmer */\n  --ts-unknown:  #84847A;   /* vérification humaine requise (dashed) */\n  --ts-conflict: #C1122C;   /* sources en désaccord */\n  --ts-decision: #16171A;   /* choix arbitré et figé (ink, filled) */\n\n  /* spacing (4px base) */\n  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 24px;\n  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px; --s-10: 128px;\n  --su: 8px;\n\n  /* radii (épuré — quasi nul) */\n  --r-0: 0px; --r-1: 3px; --r-2: 4px;\n  --radius-0: 0px; --radius-soft: 3px;\n\n  /* elevation — Datum is FLAT: hairline borders, no drop shadows */\n  --elev-0: none;\n  --border-card: 1px solid var(--line-2);\n  --border-hair: 1px solid var(--line);\n  --elev-popover: 0 4px 14px -8px rgba(22,23,26,0.18);\n  --elev-overlay: 0 10px 30px -12px rgba(22,23,26,0.22);\n\n  /* motif · datum / fracture */\n  --datum-gap: 26px;\n  --datum-line: rgba(22,23,26,0.34);\n  --datum-active: var(--accent);\n\n  /* ===================== COMPATIBILITY ALIASES (doc pages) ============== */\n  --ink-2:  var(--ink);\n  --paper:  var(--surface);\n  --paper-2:#E9E5DC;\n  --sheet:  var(--surface-2);\n\n  --n-0:#FFFFFF; --n-50:var(--surface); --n-100:#E9E5DC; --n-200:#D3D0C7;\n  --n-300:#B7B4AA; --n-400:var(--mut); --n-500:#6F6E66; --n-600:#4A4843;\n  --n-700:#2E2D29; --n-900:var(--ink);\n\n  --fg-1: var(--ink); --fg-2: var(--mut); --fg-3: var(--ink-50);\n  --fg-on-ink: var(--surface);\n  --hairline: var(--line); --hairline-strong: var(--ink); --rule: var(--line);\n\n  /* brand/active alias (no blue anywhere) */\n  --trust: var(--accent); --trust-bg:#F6E7E4; --trust-line:#E2B3AC; --trust-ink:#8F2A20;\n\n  /* state aliases → validated trust states (+ tints) */\n  --st-sourced:#1F7A44;    --st-sourced-bg:#E3F0E8;    --st-sourced-line:#A8CEB6;\n  --st-computed:#475569;   --st-computed-bg:#E8EAEE;   --st-computed-line:#B4BBC5;\n  --st-assumption:#9A6A10; --st-assumption-bg:#F2E9D4; --st-assumption-line:#D7C291;\n  --st-unknown:#84847A;    --st-unknown-bg:#ECEBE6;    --st-unknown-line:#C4C3BA;\n  --st-conflict:#C1122C;   --st-conflict-bg:#F7E1E3;   --st-conflict-line:#E6A8AE;\n  --st-decision:#16171A;   --st-decision-bg:#E7E7E4;   --st-decision-line:#BCBBB5;\n  /* secondary workflow statuses (derived, not core trust states) */\n  --st-blocked:#7A2018;    --st-blocked-bg:#F0DCD8;    --st-blocked-line:#D3A39B;\n  --st-ready:#1F7A44;      --st-ready-bg:#E3F0E8;      --st-ready-line:#A8CEB6;\n\n  /* weights */\n  --fw-light:300; --fw-reg:400; --fw-med:500; --fw-semi:600;\n\n  /* type scale (semantic, aligned to validated) */\n  --fs-display-1: clamp(40px, 5.4vw, 50px);\n  --fs-display-2: clamp(30px, 3.6vw, 38px);\n  --fs-title-1:   clamp(26px, 3vw, 34px);\n  --fs-title-2:   24px;\n  --fs-title-3:   17px;\n  --fs-lead:      18px;\n  --fs-body:      15px;\n  --fs-body-sm:   13px;\n  --fs-caption:   13px;\n  --fs-micro:     11px;\n  --fs-anno:      11px;\n  --fs-anno-sm:   10px;\n\n  --lh-tight:1.04; --lh-snug:1.12; --lh-body:1.6;\n  --tracking-display:-0.025em; --tracking-tight:-0.01em;\n  --tracking-anno:0.06em; --tracking-eyebrow:0.16em;\n\n  /* grid & layout */\n  --col-count:12; --gutter:24px; --margin:64px; --margin-sm:24px;\n  --content-max:1200px; --measure:66ch; --baseline:8px;\n\n  /* motion */\n  --ease-datum: cubic-bezier(0.2,0,0,1);\n  --ease-out:   cubic-bezier(0.16,1,0.3,1);\n  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms;\n}\n\n/* ============================================================================\n   BASE TYPE CLASSES (documentation)\n   ========================================================================== */\n.ds-display-1, .ds-display-2 {\n  font-family: var(--font-display); font-weight: var(--fw-light);\n  letter-spacing: var(--tracking-display); line-height: var(--lh-tight);\n  color: var(--fg-1); margin: 0;\n}\n.ds-display-1 { font-size: var(--fs-display-1); }\n.ds-display-2 { font-size: var(--fs-display-2); }\n\n.ds-title-1, .ds-title-2, .ds-title-3 {\n  font-family: var(--font-display); letter-spacing: var(--tracking-tight);\n  line-height: var(--lh-snug); color: var(--fg-1); margin: 0;\n}\n.ds-title-1 { font-size: var(--fs-title-1); font-weight: var(--fw-light); }\n.ds-title-2 { font-size: var(--fs-title-2); font-weight: var(--fw-reg); }\n.ds-title-3 { font-size: var(--fs-title-3); font-weight: var(--fw-semi); font-family: var(--font-ui); letter-spacing: -0.005em; }\n\n.ds-lead { font-family: var(--font-ui); font-weight: var(--fw-reg); font-size: var(--fs-lead); line-height: 1.5; color: var(--ink-90); margin: 0; max-width: var(--measure); }\n.ds-body { font-family: var(--font-ui); font-weight: var(--fw-reg); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink-90); margin: 0; max-width: var(--measure); }\n.ds-body-sm { font-size: var(--fs-body-sm); line-height: 1.5; }\n.ds-caption { font-family: var(--font-ui); font-size: var(--fs-caption); line-height: 1.4; color: var(--ink-70); margin: 0; }\n\n.ds-eyebrow, .anno, .ds-label {\n  font-family: var(--font-mono); font-weight: var(--fw-reg); font-size: var(--fs-anno);\n  letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--mut); margin: 0;\n}\n.mono, .evidence, .ds-mono {\n  font-family: var(--font-mono); font-size: var(--fs-anno);\n  letter-spacing: var(--tracking-anno); color: var(--ink-90);\n}\ncode, kbd, samp { font-family: var(--font-mono); font-size: 0.92em; }\nb, strong { font-weight: var(--fw-med); }\n\n/* ============================================================================\n   WORDMARK — ÆDIFICA. Space Grotesk Light; the Æ ligature slightly heavier.\n   ========================================================================== */\n.ds-wordmark, .brand-wm {\n  font-family: var(--font-display); font-weight: 300; letter-spacing: 0.04em;\n  line-height: 1; color: var(--ink);\n}\n.ds-wordmark .ae, .brand-wm .ae { font-weight: 400; }\n\n/* ============================================================================\n   TRUST CHIP — square, mono, no radius (validated component)\n   ========================================================================== */\n.ds-ts {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;\n  text-transform: uppercase; padding: 3px 7px; border: 1px solid; line-height: 1;\n}\n.ds-ts .dot { width: 7px; height: 7px; flex: none; }\n.ds-ts.is-sourced  { color: var(--ts-sourced);  border-color: var(--ts-sourced); }  .ds-ts.is-sourced .dot  { background: var(--ts-sourced); }\n.ds-ts.is-computed { color: var(--ts-computed); border-color: var(--ts-computed); }  .ds-ts.is-computed .dot { background: var(--ts-computed); }\n.ds-ts.is-assume   { color: var(--ts-assume);   border-color: var(--ts-assume); }    .ds-ts.is-assume .dot   { background: var(--ts-assume); }\n.ds-ts.is-unknown  { color: var(--ts-unknown);  border-color: var(--ts-unknown); border-style: dashed; } .ds-ts.is-unknown .dot { background: transparent; border: 1px solid var(--ts-unknown); }\n.ds-ts.is-conflict { color: var(--ts-conflict); border-color: var(--ts-conflict); }  .ds-ts.is-conflict .dot { background: var(--ts-conflict); }\n.ds-ts.is-decision { color: #fff; background: var(--ts-decision); border-color: var(--ts-decision); } .ds-ts.is-decision .dot { background: #fff; }\n\n/* ============================================================================\n   BUTTONS — mono uppercase (validated component)\n   ========================================================================== */\n.ds-btn {\n  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em;\n  text-transform: uppercase; padding: 13px 24px; border: 1px solid var(--ink);\n  background: var(--ink); color: var(--surface); border-radius: var(--r-1);\n  cursor: pointer; display: inline-flex; align-items: center; gap: 9px; line-height: 1;\n  transition: background var(--dur-1) var(--ease-datum), color var(--dur-1) var(--ease-datum);\n}\n.ds-btn svg { width: 15px; height: 15px; }\n.ds-btn--accent { background: var(--accent); border-color: var(--accent); color: #fff; }\n.ds-btn--ghost  { background: transparent; color: var(--ink); }\n.ds-btn--ghost:hover { background: rgba(22,23,26,0.05); }\n.ds-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n<\u002Fstyle>\n<style>/* ============================================================================\n   AEDIFICA — DATUM · brandbook.css\n   The brand book embodies the system it documents: warm paper, flat sheets,\n   square corners, hairline + datum-line structure, mono annotations, sparing\n   datum red. Loads AFTER colors_and_type.css (canonical tokens + base type).\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  background: var(--paper);\n  color: var(--fg-1);\n  font-family: var(--font-ui);\n  font-weight: var(--fw-reg);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\na { color: inherit; text-decoration: none; }\n::selection { background: var(--ink); color: var(--paper); }\n\n/* live wordmark / mono inside inlined SVG logos */\nsvg .wm   { font-family: var(--font-display); }\nsvg .mono { font-family: var(--font-mono); }\n\n/* ============================================================================\n   TOP BAR + SECTION NAV  (sticky)\n   ========================================================================== */\n.bk-topbar {\n  position: sticky; top: 0; z-index: 60;\n  background: color-mix(in srgb, var(--paper) 94%, transparent);\n  backdrop-filter: blur(3px);\n  border-bottom: 1px solid var(--ink);\n}\n.bk-topbar__row {\n  display: flex; align-items: center; gap: var(--s-5);\n  max-width: var(--content-max); margin: 0 auto; padding: 13px var(--margin);\n}\n.bk-brand { display: flex; align-items: baseline; gap: 12px; flex: none; }\n.bk-brand .ds-wordmark { font-size: 21px; }\n.bk-brand__sub {\n  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--fg-2);\n}\n.bk-ver {\n  margin-left: auto; flex: none;\n  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;\n  color: var(--fg-2); border: 1px solid var(--hairline); padding: 4px 9px;\n}\n.bk-ver b { color: var(--st-ready); font-weight: 500; }\n\n.bk-nav { border-bottom: 1px solid var(--hairline); background: var(--paper); }\n.bk-nav__row {\n  display: flex; flex-wrap: wrap; max-width: var(--content-max);\n  margin: 0 auto; padding: 0 var(--margin);\n}\n.bk-nav a {\n  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--fg-2);\n  padding: 11px 0 11px; margin-right: 18px;\n  border-bottom: 2px solid transparent; margin-bottom: -1px;\n  transition: color var(--dur-1) var(--ease-datum);\n}\n.bk-nav a:hover { color: var(--ink); }\n.bk-nav a.is-active { color: var(--ink); border-bottom-color: var(--accent); }\n.bk-nav a .num { color: var(--fg-3); margin-right: 6px; }\n\n/* ============================================================================\n   LAYOUT\n   ========================================================================== */\n.bk-wrap { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--margin); }\n\n/* a numbered chapter */\n.bk-chapter { padding: var(--s-9) 0; border-bottom: 1px solid var(--hairline); }\n.bk-chapter:last-of-type { border-bottom: none; }\n.bk-chead {\n  display: grid; grid-template-columns: 116px 1fr; gap: var(--s-5);\n  align-items: start; margin-bottom: var(--s-7);\n}\n.bk-chead__num {\n  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em;\n  color: var(--accent); padding-top: 10px;\n  border-top: 2px solid var(--ink);\n}\n.bk-chead__title h2 { margin: 0 0 var(--s-3); }\n.bk-chead__title p { margin: 0; color: var(--fg-2); max-width: 60ch; }\n.bk-chead__title .ds-eyebrow { margin-bottom: var(--s-3); }\n\n/* sub-block within a chapter */\n.bk-block { margin-top: var(--s-7); }\n.bk-block__label {\n  display: flex; align-items: baseline; gap: 12px; margin-bottom: var(--s-4);\n  padding-bottom: var(--s-2); border-bottom: 1px solid var(--hairline);\n}\n.bk-block__label .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; }\n.bk-block__label h3 { margin: 0; }\n\n/* grids */\n.cols { display: grid; gap: var(--s-5); }\n.cols-2 { grid-template-columns: repeat(2, 1fr); }\n.cols-3 { grid-template-columns: repeat(3, 1fr); }\n.cols-4 { grid-template-columns: repeat(4, 1fr); }\n.cols-6 { grid-template-columns: repeat(6, 1fr); }\n.cols-tight { gap: var(--s-3); }\n@media (max-width: 920px) { .cols-3, .cols-4, .cols-6 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 600px) { .cols-2, .cols-3, .cols-4, .cols-6 { grid-template-columns: 1fr; } }\n\n/* ============================================================================\n   PANELS / SHEETS — flat, hairline, square corners. No translucency.\n   ========================================================================== */\n.panel { background: var(--sheet); border: 1px solid var(--hairline); padding: var(--s-5); }\n.panel--well { background: var(--paper-2); }\n.panel--ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n.panel--ink .ds-eyebrow, .panel--ink .bk-k { color: var(--n-300); }\n.panel--ink .ds-body, .panel--ink .ds-body-sm, .panel--ink p { color: rgba(243,241,236,0.84); }\n.panel--pad { padding: var(--s-6); }\n\n.datum-frame { position: relative; }\n.datum-frame::before, .datum-frame::after {\n  content: \"\"; position: absolute; width: 11px; height: 11px;\n  border: 1px solid var(--ink); pointer-events: none;\n}\n.datum-frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }\n.datum-frame::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }\n\n.bk-k { font-family: var(--font-mono); font-size: 0.86em; background: var(--paper-2); padding: 1px 6px; border: 1px solid var(--hairline); white-space: nowrap; }\n.lead-accent { color: var(--accent); }\n\n/* numbered principle / statement card */\n.bk-stmt { background: var(--sheet); border: 1px solid var(--hairline); padding: var(--s-5); position: relative; }\n.bk-stmt__n { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--fg-3); margin-bottom: var(--s-3); display: block; }\n.bk-stmt h4 { margin: 0 0 var(--s-2); font-family: var(--font-ui); font-size: 17px; font-weight: var(--fw-semi); letter-spacing: -0.005em; }\n.bk-stmt p { margin: 0; }\n\n/* ============================================================================\n   COVER\n   ========================================================================== */\n.bk-cover {\n  position: relative; min-height: 100vh; padding: var(--s-8) var(--margin) var(--s-7);\n  display: grid; grid-template-rows: auto 1fr auto; max-width: var(--content-max);\n  margin: 0 auto;\n}\n.bk-cover__rule { border-bottom: 1px solid var(--ink); }\n.bk-cover__top {\n  display: flex; justify-content: space-between; align-items: baseline;\n  padding-bottom: var(--s-4); border-bottom: 1px solid var(--ink);\n  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;\n  text-transform: uppercase; color: var(--fg-2);\n}\n.bk-cover__mid { display: flex; flex-direction: column; justify-content: center; padding: var(--s-8) 0; position: relative; }\n.bk-cover__eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--s-5); }\n.bk-cover__word { margin: 0; }\n.bk-cover__word .ds-wordmark {\n  font-size: clamp(64px, 15vw, 184px); letter-spacing: 0.02em; line-height: 0.92; display: block;\n}\n.bk-cover__datum { position: relative; height: 16px; margin: var(--s-3) 0 var(--s-6); }\n.bk-cover__datum svg { display: block; width: 100%; height: 16px; overflow: visible; }\n.bk-cover__title { font-family: var(--font-display); font-weight: var(--fw-light); font-size: clamp(26px, 3.4vw, 44px); letter-spacing: -0.02em; line-height: 1.05; margin: 0; max-width: 22ch; }\n.bk-cover__bottom {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-5);\n  padding-top: var(--s-5); border-top: 1px solid var(--ink);\n}\n.bk-cover__meta .l { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); display: block; margin-bottom: 6px; }\n.bk-cover__meta .v { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }\n.bk-cornertick { position: absolute; width: 14px; height: 14px; pointer-events: none; color: var(--accent); }\n\n/* ============================================================================\n   SPEC TABLE\n   ========================================================================== */\n.spec { width: 100%; border-collapse: collapse; font-size: var(--fs-body-sm); }\n.spec th {\n  text-align: left; font-family: var(--font-mono); font-weight: 400;\n  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--fg-3); padding: 10px 14px 8px; border-bottom: 1px solid var(--ink);\n}\n.spec td { padding: 11px 14px; border-bottom: 1px solid var(--hairline); vertical-align: top; }\n.spec tr:last-child td { border-bottom: none; }\n.spec .tok { font-family: var(--font-mono); font-size: 12px; color: var(--ink); white-space: nowrap; }\n.spec .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }\n.spec .use { color: var(--fg-2); }\n\n/* ============================================================================\n   SWATCHES + RAMP\n   ========================================================================== */\n.swatch { display: flex; flex-direction: column; }\n.swatch__chip { height: 86px; border: 1px solid var(--rule); }\n.swatch__meta { padding: 9px 0 0; }\n.swatch__name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink); }\n.swatch__hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-top: 2px; }\n.swatch__use { font-size: 12px; color: var(--fg-2); margin-top: 6px; line-height: 1.4; }\n\n.ramp { display: grid; grid-template-columns: repeat(9, 1fr); border: 1px solid var(--ink); }\n.ramp > div { height: 60px; position: relative; }\n.ramp > div span { position: absolute; bottom: 6px; left: 6px; font-family: var(--font-mono); font-size: 9px; }\n\n/* ============================================================================\n   TRUST-STATE CARDS\n   ========================================================================== */\n.state-card { border: 1px solid var(--hairline); background: var(--sheet); }\n.state-card__top { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--hairline); }\n.state-card__sq { width: 40px; height: 40px; flex: none; border: 2px solid currentColor; }\n.state-card__sq.solid { background: currentColor; }\n.state-card__sq.dashed { border-style: dashed; background: transparent; }\n.state-card__name { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }\n.state-card__hex { font-family: var(--font-mono); font-size: 11px; color: var(--mut); margin-top: 2px; }\n.state-card__body { padding: 13px 16px; }\n.state-card__body .ex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 9px; display: block; }\n\n/* ============================================================================\n   TYPE SPECIMEN ROWS\n   ========================================================================== */\n.spec-row { display: grid; grid-template-columns: 150px 1fr; gap: var(--s-5); padding: 22px 0; border-bottom: 1px solid var(--hairline); align-items: baseline; }\n.spec-row:first-child { border-top: 1px solid var(--ink); }\n.spec-row__meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); line-height: 1.5; }\n\n/* ============================================================================\n   ICON GRID\n   ========================================================================== */\n.ico-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); border-top: 1px solid var(--hairline); border-left: 1px solid var(--hairline); }\n.ico { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 22px 8px; border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }\n.ico svg { width: 26px; height: 26px; color: var(--ink); }\n.ico span { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); text-align: center; }\n.i { width: 22px; height: 22px; display: inline-block; vertical-align: middle; color: var(--ink); }\n\n/* ============================================================================\n   NOTES / CALLOUTS\n   ========================================================================== */\n.note { border: 1px solid var(--hairline); border-left: 3px solid var(--ink); background: var(--sheet); padding: var(--s-4) var(--s-5); font-size: var(--fs-body-sm); }\n.note--warn { border-left-color: var(--st-conflict); }\n.note--info { border-left-color: var(--accent); }\n.note__label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); display: block; margin-bottom: 6px; }\n\n/* DO / DON'T */\n.dodont { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); }\n@media (max-width: 600px) { .dodont { grid-template-columns: 1fr; } }\n.dd { border: 1px solid var(--hairline); background: var(--sheet); }\n.dd__tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 9px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }\n.dd--do .dd__tag { color: var(--st-ready); }\n.dd--dont .dd__tag { color: var(--st-conflict); }\n.dd__body { padding: var(--s-4) var(--s-5); }\n.dd__body ul { margin: 0; padding-left: 18px; color: var(--ink-90); }\n.dd__body li { margin-bottom: 7px; font-size: var(--fs-body-sm); line-height: 1.5; }\n.dd__body li:last-child { margin-bottom: 0; }\n\n/* lexicon two-up */\n.lex { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--hairline); }\n.lex__col { padding: 0; }\n.lex__col + .lex__col { border-left: 1px solid var(--hairline); }\n.lex__head { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 10px 16px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }\n.lex--use .lex__head { color: var(--st-ready); }\n.lex--avoid .lex__head { color: var(--st-conflict); }\n.lex__list { list-style: none; margin: 0; padding: 6px 0; }\n.lex__list li { padding: 7px 16px; font-size: var(--fs-body-sm); }\n.lex--avoid .lex__list li { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--st-conflict-line); }\n@media (max-width: 600px) { .lex { grid-template-columns: 1fr; } .lex__col + .lex__col { border-left: none; border-top: 1px solid var(--hairline); } }\n\n/* ============================================================================\n   COMPONENTS (showcase versions)\n   ========================================================================== */\n.field { display: flex; flex-direction: column; gap: 7px; }\n.field label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-2); }\n.field input, .field select, .field textarea { font-family: var(--font-ui); font-size: 15px; color: var(--ink); background: var(--sheet); border: 1px solid var(--n-300); border-radius: var(--r-1); padding: 11px 13px; }\n.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }\n.field--err input { border-color: var(--st-conflict); }\n.field__msg { font-family: var(--font-mono); font-size: 11px; color: var(--st-conflict); }\n.checkrow { display: flex; align-items: center; gap: 10px; font-size: 14px; }\n.checkbox { width: 18px; height: 18px; border: 1px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }\n.checkbox svg { width: 13px; height: 13px; color: var(--paper); }\n.checkbox.on { background: var(--ink); }\n\n.tabs { display: flex; border-bottom: 1px solid var(--ink); }\n.tab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 11px 16px; border: none; background: none; color: var(--fg-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }\n.tab.on { color: var(--ink); border-bottom-color: var(--ink); }\n\n.kpi { border: 1px solid var(--hairline); background: var(--sheet); padding: 18px; }\n.kpi__label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-2); }\n.kpi__num { font-family: var(--font-display); font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.02em; margin: 12px 0 10px; }\n.kpi__foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }\n\n.chip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; border-radius: 0; background: var(--sheet); }\n.chip .dot { width: 7px; height: 7px; background: currentColor; flex: none; }\n.state-sq { width: 14px; height: 14px; border: 1.5px solid currentColor; display: inline-block; vertical-align: middle; }\n\n.claim { border: 1px solid var(--hairline); background: var(--sheet); }\n.claim__b { padding: 16px 18px; }\n.claim__stmt { font-size: 16px; line-height: 1.5; margin: 0; }\n.claim__foot { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }\n.claim__src { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }\n.conf { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); display: flex; align-items: center; gap: 7px; margin-left: auto; }\n.conf__bar { width: 54px; height: 5px; background: var(--n-200); position: relative; }\n.conf__bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--st-sourced); }\n\n.ev { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hairline); }\n.ev:last-child { border-bottom: none; }\n.ev svg { width: 18px; height: 18px; color: var(--accent); }\n.ev__ref { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }\n.ev__meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 2px; }\n\n.ledger { border-left: 3px solid var(--st-decision); background: var(--sheet); border-top: 1px solid var(--hairline); border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: 14px 16px; }\n.ledger__id { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }\n.ledger__meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-top: 9px; display: flex; gap: 16px; flex-wrap: wrap; }\n\n.dt { width: 100%; border-collapse: collapse; font-size: 14px; }\n.dt th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ink); }\n.dt td { padding: 12px; border-bottom: 1px solid var(--hairline); }\n.dt tr:last-child td { border-bottom: none; }\n.dt .num { font-family: var(--font-mono); }\n\n.ph { border: 1px dashed var(--n-300); background: var(--sheet); padding: 24px; text-align: center; color: var(--fg-2); }\n.ph svg { width: 26px; height: 26px; color: var(--n-400); }\n.skl { height: 12px; background: linear-gradient(90deg, var(--paper-2), var(--n-100), var(--paper-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }\n@keyframes sh { to { background-position: -200% 0; } }\n\n/* ============================================================================\n   APPLICATIONS\n   ========================================================================== */\n.app-frame { background: var(--paper-2); border: 1px solid var(--hairline); padding: var(--s-6); display: flex; align-items: center; justify-content: center; }\n.app-cap { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-top: 10px; letter-spacing: 0.04em; }\n\n/* A4 mini sheet */\n.a4 { width: 100%; max-width: 420px; aspect-ratio: 210 / 297; background: var(--surface-2); border: 1px solid var(--line-2); padding: 30px 30px; display: flex; flex-direction: column; box-shadow: var(--elev-overlay); }\n.a4__head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--ink); padding-bottom: 12px; }\n.a4__head .ds-wordmark { font-size: 18px; }\n.a4__ref { font-family: var(--font-mono); font-size: 8px; color: var(--fg-2); text-align: right; line-height: 1.6; }\n.a4__title { font-family: var(--font-display); font-weight: 300; font-size: 22px; letter-spacing: -0.02em; margin: 18px 0 4px; }\n.a4__sub { font-family: var(--font-mono); font-size: 8px; color: var(--fg-2); letter-spacing: 0.06em; }\n.a4__row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 10px; }\n.a4__row .lab { color: var(--ink); flex: 1; }\n.a4__chip { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 5px; border: 1px solid currentColor; }\n.a4__foot { margin-top: auto; border-top: 1px solid var(--ink); padding-top: 10px; font-family: var(--font-mono); font-size: 7.5px; color: var(--fg-2); letter-spacing: 0.04em; }\n\n/* dashboard mini */\n.dash { width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); box-shadow: var(--elev-overlay); overflow: hidden; }\n.dash__bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--ink); }\n.dash__bar .ds-wordmark { font-size: 15px; }\n.dash__bar .sub { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }\n.dash__bar .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; }\n.dash__body { padding: 16px; }\n\n/* business card */\n.card-stk { display: flex; gap: var(--s-5); flex-wrap: wrap; justify-content: center; }\n.bcard { width: 320px; height: 198px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line-2); box-shadow: var(--elev-ove
