<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px 26px;background:var(--surface)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sw{display:flex;flex-direction:column}.c{height:64px;border:1px solid var(--line)}.n{font-family:var(--font-mono);font-size:11px;margin-top:7px}.h{font-family:var(--font-mono);font-size:10px;color:var(--mut);margin-top:2px}</style></head>
<body><div class="row">
  <div class="sw"><div class="c" style="background:var(--surface)"></div><div class="n">surface</div><div class="h">#F3F1EC</div></div>
  <div class="sw"><div class="c" style="background:var(--ink)"></div><div class="n">ink</div><div class="h">#16171A</div></div>
  <div class="sw"><div class="c" style="background:var(--accent)"></div><div class="n">accent · datum</div><div class="h">#C0392B</div></div>
  <div class="sw"><div class="c" style="background:var(--accent-2)"></div><div class="n">accent-2 · béton</div><div class="h">#908E85</div></div>
</div></body></html>
