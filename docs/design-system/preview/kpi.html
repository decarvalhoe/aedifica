<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 26px;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{border:1px solid var(--hairline);background:var(--sheet);padding:16px}
.l{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.n{font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1;letter-spacing:-.02em;margin:10px 0 8px}
.f{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
.sq{width:13px;height:13px;border:1.5px solid currentColor}</style></head>
<body>
  <div class="kpi"><div class="l">Projets actifs</div><div class="n">14</div><div class="f" style="color:var(--st-ready)"><span class="sq" style="background:currentColor"></span>9 ready</div></div>
  <div class="kpi"><div class="l">Hauteur max</div><div class="n">12<span style="font-size:18px"> m</span></div><div class="f" style="color:var(--st-sourced)"><span class="sq" style="background:currentColor"></span>sourced</div></div>
  <div class="kpi"><div class="l">Signaux opp.</div><div class="n">3</div><div class="f" style="color:var(--st-conflict)"><span class="sq" style="background:currentColor"></span>1 conflict</div></div>
</body></html>
