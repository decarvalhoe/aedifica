<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 26px;background:var(--paper);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.box{background:var(--sheet);border:1px solid var(--hairline);height:60px;width:120px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}</style></head>
<body>
  <div class="box" style="border-radius:0">radius-0</div>
  <div class="box" style="border-radius:2px">radius-soft 2</div>
  <div class="box" style="box-shadow:var(--elev-popover);border:none">elev-popover</div>
  <div class="box" style="box-shadow:var(--elev-overlay);border:none">elev-overlay</div>
</body></html>
