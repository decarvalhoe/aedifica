<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 26px;background:var(--paper)}
.ramp{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid var(--ink)}.ramp>div{height:74px;position:relative}
.ramp span{position:absolute;bottom:6px;left:6px;font-family:var(--font-mono);font-size:9px}</style></head>
<body><div class="ramp">
  <div style="background:var(--n-0)"><span>0</span></div>
  <div style="background:var(--n-50)"><span>50</span></div>
  <div style="background:var(--n-100)"><span>100</span></div>
  <div style="background:var(--n-200)"><span>200</span></div>
  <div style="background:var(--n-300)"><span>300</span></div>
  <div style="background:var(--n-400)"><span style="color:#fff">400</span></div>
  <div style="background:var(--n-500)"><span style="color:#fff">500</span></div>
  <div style="background:var(--n-600)"><span style="color:#fff">600</span></div>
  <div style="background:var(--n-900)"><span style="color:#fff">900</span></div>
</div></body></html>
