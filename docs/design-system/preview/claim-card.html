<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 26px;background:var(--surface)}
.claim{border:var(--border-card);background:var(--surface-2);max-width:440px}
.b{padding:16px 18px}
.stmt{font-family:var(--font-ui);font-weight:500;font-size:15px;line-height:1.5;color:var(--ink);margin:12px 0 0}
.foot{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:var(--border-hair)}
.src{font-family:var(--font-mono);font-size:11px;color:var(--mut)}
.conf{font-family:var(--font-mono);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:7px;margin-left:auto}
.bar{width:54px;height:5px;background:#E3E1DA;position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ts-sourced)}</style></head>
<body><div class="claim">
  <div class="b"><span class="ds-ts is-sourced"><span class="dot"></span>Sourced</span>
  <p class="stmt">Hauteur maximale au faîte : 12 m en zone 2.</p></div>
  <div class="foot"><span class="src">RPGA art. 19 al. 2</span><span class="conf">conf <span class="bar"><i style="width:92%"></i></span> 0.92</span></div>
</div></body></html>
