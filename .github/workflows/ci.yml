name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pilot:
    name: Pilot smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate jurisdiction packs
        run: python pilot/validate_packs.py

      - name: Validate commune pack regressions
        run: python pilot/validate_commune_packs.py

      - name: Validate project manifest schema
        run: python pilot/validate_manifest.py

      - name: Validate source and evidence store
        run: python pilot/validate_evidence_store.py

      - name: Validate project-scoped constraint brief
        run: python pilot/validate_brief.py

      - name: Validate pack freshness gate
        run: python pilot/validate_freshness.py

      - name: Validate phase-aware constraint matrices
        run: python pilot/validate_matrix.py

      - name: Validate permit checklists
        run: python pilot/validate_permit.py

      - name: Validate dossier evidence manifest
        run: python pilot/validate_dossier_evidence.py

      - name: Validate compliance gates
        run: python pilot/validate_compliance.py

      - name: Validate phase-33 compliance workspace report
        run: python pilot/validate_compliance_report.py

      - name: Validate research backbone
        run: python pilot/validate_research.py

      - name: Validate project memory
        run: python pilot/validate_memory.py

      - name: Validate project ledger
        run: python pilot/validate_ledger.py

      - name: Validate project workspace
        run: python pilot/validate_workspace.py

      - name: Validate cost contracts
        run: python pilot/validate_cost.py

      - name: Validate site contracts
        run: python pilot/validate_site.py

      - name: Validate adapter capability manifests
        run: python pilot/validate_adapter_capability.py

      - name: Validate privacy redaction pass
        run: python pilot/validate_redaction.py

      - name: Run contract test directory
        run: python tests/contracts/run_contracts.py

      - name: Run offline pilot selfcheck
        run: python pilot/selfcheck.py

      - name: Run R1B milestone release gate
        run: python pilot/release_gate.py R1B --no-selfcheck

  product:
    name: Product stack (DB + API)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    # Real Postgres with pgvector so the W19-H1 RLS + semantic-vector test is
    # actually exercised (not skipped): the project-isolation RLS policy and the
    # pgvector `<=>` ranking run against a genuine engine, per the hardening
    # discipline ("RLS exercée sur Postgres réel").
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aedifica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install product dependencies
        run: pip install -e ".[product,test]"

      - name: Alembic migration applies on a clean SQLite db
        env:
          AEDIFICA_DATABASE_URL: sqlite:///ci.db
        run: python -m alembic upgrade head

      - name: Product test suite (models + repositories + API + ingestion)
        env:
          AEDIFICA_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aedifica_test
        run: python -m pytest tests/product -q

      - name: Parity — offline engine stays green
        run: python pilot/selfcheck.py

  e2e:
    name: Web E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install product dependencies
        run: pip install -e ".[product]"

      - name: Start API
        env:
          AEDIFICA_DATABASE_URL: sqlite:///e2e.db
          AEDIFICA_CREATE_ALL: "1"
        run: |
          python -m uvicorn aedifica.api.app:app --host 127.0.0.1 --port 8090 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8090/api/health >/dev/null && break; sleep 1; done

      - name: Build and start web
        working-directory: web
        env:
          AEDIFICA_API: http://127.0.0.1:8090
        run: |
          npm install
          npm run build
          npx next start -p 3100 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3100/api/health >/dev/null && break; sleep 1; done

      - name: Playwright smoke (auth -> project -> action loop)
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  # W21-0 — the demo redeploys itself on every green main push, so it can never
  # silently go stale again (it sat 19 commits behind between Jun 7 and Jun 11).
  deploy:
    name: Deploy demo (Fly.io)
    runs-on: ubuntu-latest
    needs: [pilot, product, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (remote build)
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
