name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pilot:
    name: Pilot smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate jurisdiction packs
        run: python pilot/validate_packs.py

      - name: Validate phase-aware constraint matrices
        run: python pilot/validate_matrix.py

      - name: Validate permit checklists
        run: python pilot/validate_permit.py

      - name: Validate compliance gates
        run: python pilot/validate_compliance.py

      - name: Validate research backbone
        run: python pilot/validate_research.py

      - name: Run offline pilot selfcheck
        run: python pilot/selfcheck.py
